name: cd

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    env:
      # Read by scripts/migrateup.sh, which finds no .env file on the runner.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Unused: referenced so the runner receives the value and redacts it from logs.
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.0"

      - name: Install goose
        run: go install github.com/pressly/goose/v3/cmd/goose@v3.27.3

      - name: Build
        run: ./scripts/buildprod.sh

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build and push Docker image
        run: gcloud builds submit --tag "${{ secrets.GAR_IMAGE }}" .

      - name: Run database migrations
        run: ./scripts/migrateup.sh

      - name: Deploy to Cloud Run
        run: gcloud run deploy notely --image "${{ secrets.GAR_IMAGE }}" --region us-central1 --allow-unauthenticated --project "${{ secrets.GCP_PROJECT_ID }}" --max-instances=4